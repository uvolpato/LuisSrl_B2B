<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Ricarica automatica: appena il deploy toglie il flag, ricompare il sito. -->
  <meta http-equiv="refresh" content="15">
  <title>Manutenzione in corso — Luis S.r.l.</title>
  <style>
    :root {
      --bg: #f6f5f2; --fg: #1c1b19; --muted: #6b6862; --card: #ffffff;
      --border: #e6e3dd; --accent: #7a6a53;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --fg: #ececec; --muted: #9a968e; --card: #201f1c; --border: #302e2a; --accent: #b39b78; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      max-width: 440px; width: 100%; padding: 40px 32px; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px;
      background: var(--accent); display: grid; place-items: center; color: #fff;
    }
    h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -.01em; }
    p { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 8px; }
    .spinner {
      width: 22px; height: 22px; margin: 22px auto 0; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foot { margin-top: 24px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>
      </svg>
    </div>
    <h1>Stiamo aggiornando il portale</h1>
    <p>Il Portale B2B Luis è momentaneamente offline per un aggiornamento.</p>
    <p>Torna online tra pochi minuti: questa pagina si ricarica da sola.</p>
    <div class="spinner" aria-hidden="true"></div>
    <div class="foot">Luis S.r.l. · info@luisbg.it</div>
  </main>
</body>
</html>
