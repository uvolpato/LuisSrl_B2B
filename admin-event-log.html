<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log eventi — Admin</title>
<style>
:root {
  --bg: oklch(97% 0.005 80); --surface: oklch(100% 0 0);
  --fg: oklch(22% 0.02 60); --muted: oklch(52% 0.015 60);
  --border: oklch(88% 0.01 70); --accent: oklch(55% 0.14 45);
  --accent-soft: oklch(96% 0.004 80);
  --green: oklch(55% 0.15 145); --green-soft: color-mix(in oklch, var(--green) 14%, transparent);
  --red: oklch(55% 0.18 25); --red-soft: color-mix(in oklch, var(--red) 14%, transparent);
  --blue: oklch(55% 0.15 250); --blue-soft: color-mix(in oklch, var(--blue) 14%, transparent);
  --amber: oklch(60% 0.13 65); --amber-soft: color-mix(in oklch, var(--amber) 16%, transparent);
  --table-head-bg: oklch(92.5% 0.006 79);
  --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
  --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  --radius: 12px; --radius-lg: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; font-family: var(--font-body); font-size: 14px; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }

/* ── AdminTopBar ── */
.admin-top { position: sticky; top: 0; z-index: 10; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.admin-top h1 { font-size: 20px; letter-spacing: -0.01em; margin: 0; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 8px; border: 1px solid transparent; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; text-decoration: none; font-family: var(--font-body); transition: transform 0.05s ease, background 0.15s ease; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.6; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
.btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--fg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── Content ── */
.admin-content { flex: 1; min-height: 0; padding: 16px 32px 24px; display: flex; flex-direction: column; overflow: auto; }

/* ── Dashboard ── */
.dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; flex-shrink: 0; }
@media (max-width: 900px) { .dash-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .dash-grid { grid-template-columns: 1fr; } }
.dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; border-left: 3px solid var(--accent); }
.dash-card .label { font-size: 11px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
.dash-card .value { font-family: var(--font-mono); font-size: 28px; font-weight: 700; line-height: 1.1; }
.dash-card .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ── Filter bar ── */
.filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-shrink: 0; flex-wrap: wrap; }
.filter-bar input[type="date"] { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font: inherit; font-size: 13px; color: var(--fg); outline: none; font-family: var(--font-mono); }
.filter-bar input[type="date"]:focus { border-color: var(--accent); }

/* ── Search ── */
.admin-search { position: relative; width: 240px; }
.admin-search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font: inherit; font-size: 13px; color: var(--fg); outline: none; }
.admin-search input:focus { border-color: var(--accent); }
.admin-search .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.admin-search .search-icon svg { width: 14px; height: 14px; }

/* ── DataTable ── */
.data-table { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-left: 1px solid var(--table-head-bg); border-right: 1px solid var(--table-head-bg); border-radius: var(--radius-lg); overflow: hidden; }
.data-table-scroll { flex: 1; min-height: 0; overflow: auto; }
.data-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
.data-table thead th { position: sticky; top: 0; z-index: 4; background: var(--table-head-bg); color: var(--muted); font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; text-align: left; padding: 12px 16px; white-space: nowrap; border-bottom: 1px solid var(--border); }
.data-table tbody td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--fg); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--fg-soft); }
.data-table td.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.data-table-empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
.data-table-actions { text-align: right; white-space: nowrap; }
.data-table .row-action { position: relative; width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; transition: background 0.12s, color 0.12s; }
.data-table .row-action:hover { background: var(--fg-soft); color: var(--fg); }
.data-table .row-action svg { width: 16px; height: 16px; }
.data-table .row-action::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 4px 8px; background: var(--fg); color: var(--surface); font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; white-space: nowrap; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity 0.12s; z-index: 5; }
.data-table .row-action:hover::after { opacity: 1; }
.data-table-footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.data-table-footer .pager { display: flex; align-items: center; gap: 8px; }
.data-table-footer .pager-current { min-width: 56px; text-align: center; }
.data-table-footer .pager button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); cursor: pointer; }
.data-table-footer .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.data-table-footer .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
.data-table-footer .pager button svg { width: 16px; height: 16px; display: block; }

/* ── Type badges ── */
.type-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.type-access { background: var(--fg-soft); color: var(--muted); }
.type-error { background: var(--red-soft); color: var(--red); }
.type-mutation { background: var(--blue-soft); color: var(--blue); }
.type-business { background: var(--green-soft); color: var(--green); }
.type-sync { background: var(--amber-soft); color: var(--amber); }

/* ── Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 90; background: color-mix(in oklch, var(--fg) 40%, transparent); align-items: center; justify-content: center; padding: 32px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column; animation: fadeIn 0.15s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 24px 28px 16px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 20px; margin: 0; line-height: 1.3; }
.modal-close { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.modal-close:hover { background: var(--fg-soft); color: var(--fg); }
.modal-close svg { width: 16px; height: 16px; }
.modal-body { padding: 24px 28px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 28px; border-top: 1px solid var(--border); }

/* ── Detail rows ── */
.detail-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 13px; }
.detail-row .lbl { color: var(--muted); min-width: 110px; flex-shrink: 0; }
.detail-row .val { font-weight: 500; font-family: var(--font-mono); text-align: right; }

/* ── JSON viewer ── */
.json-viewer { margin-top: 14px; padding: 14px 16px; background: var(--fg-soft); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; max-height: 300px; overflow: auto; white-space: pre-wrap; color: var(--fg); }

/* ── Timeline ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 18px; }
.timeline-item::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); }
.timeline-item:first-child::before { background: var(--accent); border-color: var(--accent); }
.timeline-item .tl-date { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-bottom: 2px; }
.timeline-item .tl-action { font-size: 13px; font-weight: 500; }
.timeline-item .tl-diff { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── Totals bar ── */
.filter-info { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.filter-info strong { color: var(--fg); }
</style>
</head>
<body>

<!-- AdminTopBar -->
<div class="admin-top">
  <h1>Log eventi</h1>
  <div class="top-actions">
    <div class="admin-search">
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input type="text" id="search-input" placeholder="Cerca azione o entity...">
    </div>
    <select id="filter-type" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font:inherit;font-size:13px;color:var(--fg);outline:none;cursor:pointer">
      <option value="all">Tutti i tipi</option>
      <option value="access">Access</option>
      <option value="error">Error</option>
      <option value="mutation">Mutation</option>
      <option value="business">Business</option>
      <option value="sync">Sync</option>
    </select>
  </div>
</div>

<div class="admin-content">

  <!-- KPI Cards -->
  <div class="dash-grid">
    <div class="dash-card"><div class="label">Eventi (24h)</div><div class="value" id="dash-total">1.247</div><div class="sub">tutti i tipi</div></div>
    <div class="dash-card"><div class="label">Errori (24h)</div><div class="value" id="dash-errors" style="color:var(--red)">12</div><div class="sub">0,9% del totale</div></div>
    <div class="dash-card"><div class="label">Richieste (24h)</div><div class="value" id="dash-access">8.450</div><div class="sub">traffico HTTP</div></div>
    <div class="dash-card"><div class="label">Risposta media</div><div class="value" id="dash-avg">48 ms</div><div class="sub">ultime 24 ore</div></div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <input type="date" id="date-from" value="2026-08-12">
    <span style="color:var(--muted)">→</span>
    <input type="date" id="date-to" value="2026-08-13">
    <span style="margin-left:auto" class="filter-info">
      <span>Eventi: <strong id="filter-count">1.247</strong></span>
      <span>Pagina: <strong id="filter-page">1 / 25</strong></span>
    </span>
  </div>

  <!-- DataTable -->
  <div class="data-table">
    <div class="data-table-scroll">
      <table>
        <colgroup><col style="width:96px"><col><col style="width:150px"><col style="width:110px"><col style="width:140px"><col style="width:60px"></colgroup>
        <thead>
          <tr><th>Tipo</th><th>Azione</th><th>Entità</th><th>Utente</th><th>Data</th><th></th></tr>
        </thead>
        <tbody id="log-tbody"></tbody>
      </table>
      <div class="data-table-empty" id="log-empty" hidden>Nessun evento trovato con questi filtri.</div>
    </div>
    <div class="data-table-footer">
      <span id="footer-range">1–50 di 1.247</span>
      <div class="pager">
        <button id="pager-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="pager-current" id="pager-info">1 / 25</span>
        <button id="pager-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
  </div>

</div>

<!-- ═══════ MODAL: DETTAGLIO EVENTO ═══════ -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="detail-title">Dettaglio evento</h2>
      <button class="modal-close" onclick="closeModal('detail-modal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('detail-modal')">Chiudi</button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: TIMELINE ENTITÀ ═══════ -->
<div class="modal-overlay" id="timeline-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="timeline-title">Timeline</h2>
      <button class="modal-close" onclick="closeModal('timeline-modal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="timeline-body"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('timeline-modal')">Chiudi</button>
    </div>
  </div>
</div>

<script>
/* ── DATA ── */
var EVENTS = [
  { id:1, type:"access", action:"GET /api/catalogo → 200", entity:"", entityId:"", actor:"—", actorId:null, date:"2026-08-12 14:23:10", duration:32, requestId:"a1b2-c3d4", ip:"192.168.1.100", data:{ method:"GET", url:"/api/catalogo", status:200, duration:32 } },
  { id:2, type:"business", action:"Conferma ordine", entity:"ordine", entityId:"B2B-1723", actor:"uvolpato", actorId:5, date:"2026-08-12 14:22:45", requestId:"a1b2-c3d3", ip:"192.168.1.100", data:{ numeroOrdine:"B2B-1723", importo:844.20, pezzi:12, clienteId:5, coupon:"ESTATE25" } },
  { id:3, type:"mutation", action:"Admin — modifica articolo", entity:"articolo", entityId:"LINEA_ROGERS", actor:"admin@luissrl.it", actorId:1, date:"2026-08-12 14:21:30", requestId:"a1b2-c3d2", ip:"10.0.0.5", data:{ old:{ nome:"Vaso Rogers" }, new:{ nome:"Vaso Rogers 2.0" }, fields:["nome"], changedBy:1 } },
  { id:4, type:"error", action:"POST /api/checkout/conferma → 500", entity:"", entityId:"", actor:"uvolpato", actorId:5, date:"2026-08-12 14:20:15", requestId:"a1b2-c3d1", ip:"192.168.1.100", data:{ url:"/api/checkout/conferma", method:"POST", status:500, message:"Connection refused", requestId:"a1b2-c3d1" } },
  { id:5, type:"access", action:"POST /api/checkout/conferma → 500", entity:"", entityId:"", actor:"uvolpato", actorId:5, date:"2026-08-12 14:20:14", duration:1001, requestId:"a1b2-c3d1", ip:"192.168.1.100", data:{ method:"POST", url:"/api/checkout/conferma", status:500, duration:1001 } },
  { id:6, type:"sync", action:"Sync articoli completato", entity:"articolo", entityId:"", actor:"system", actorId:null, date:"2026-08-12 14:00:00", requestId:"", ip:"", data:{ count:1250, nuovi:12, modificati:45, tempo:3200 } },
  { id:7, type:"access", action:"GET /area/catalogo → 200", entity:"", entityId:"", actor:"uvolpato", actorId:5, date:"2026-08-12 13:55:22", duration:45, requestId:"e5f6-g7h8", ip:"192.168.1.100", data:{ method:"GET", url:"/area/catalogo", status:200, duration:45 } },
  { id:8, type:"business", action:"Login", entity:"", entityId:"", actor:"uvolpato", actorId:5, date:"2026-08-12 13:54:58", requestId:"e5f6-g7h7", ip:"192.168.1.100", data:{ email:"cliente@test.it", remember:false } },
  { id:9, type:"mutation", action:"Admin — modifica tariffa", entity:"tariffa", entityId:"12", actor:"admin@luissrl.it", actorId:1, date:"2026-08-12 13:30:10", requestId:"i9j0-k1l2", ip:"10.0.0.5", data:{ old:{ percentuale:1.8 }, new:{ percentuale:2.2 }, fields:["percentuale"] } },
  { id:10, type:"mutation", action:"Admin — crea cliente", entity:"cliente", entityId:"28", actor:"admin@luissrl.it", actorId:1, date:"2026-08-12 13:15:00", requestId:"i9j0-k1l1", ip:"10.0.0.5", data:{ old:null, new:{ ragioneSociale:"Nuovo Cliente Srl", piva:"IT12345678901" }, fields:["ragioneSociale","piva"] } },
  { id:11, type:"business", action:"Aggiunto al carrello", entity:"carrello", entityId:"42", actor:"uvolpato", actorId:5, date:"2026-08-12 12:10:00", requestId:"m3n4-o5p6", ip:"192.168.1.100", data:{ varianteCodice:"LU3608", quantita:5 } },
  { id:12, type:"sync", action:"Sync clienti completato", entity:"cliente", entityId:"", actor:"system", actorId:null, date:"2026-08-12 08:00:00", requestId:"", ip:"", data:{ count:380, nuovi:3, modificati:15, tempo:2100 } }
];

var FILTERS = { type: 'all', search: '', dateFrom: '2026-08-12', dateTo: '2026-08-13' };
var currentPage = 1;
var PAGE_SIZE = 10;

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(function(m) { m.addEventListener('click', function(e) { if (e.target === m) closeModal(m.id); }); });

/* ── RENDER TABLE ── */
function filteredEvents() {
  return EVENTS.filter(function(e) {
    if (FILTERS.type !== 'all' && e.type !== FILTERS.type) return false;
    if (FILTERS.search) {
      var q = FILTERS.search.toLowerCase();
      if (e.action.toLowerCase().indexOf(q) === -1 && (e.entity + e.entityId).toLowerCase().indexOf(q) === -1 && e.actor.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  var filtered = filteredEvents();
  var totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
  var start = (currentPage - 1) * PAGE_SIZE;
  var page = filtered.slice(start, start + PAGE_SIZE);
  var html = '';
  for (var i = 0; i < page.length; i++) {
    var e = page[i];
    html += '<tr>'
      + '<td><span class="type-badge type-' + e.type + '">' + e.type + '</span></td>'
      + '<td style="font-size:13px">' + e.action + '</td>'
      + '<td class="mono" style="font-size:12px">' + (e.entity ? e.entity + ' / ' + e.entityId : '\u2014') + '</td>'
      + '<td style="font-size:12px">' + (e.actor || '\u2014') + '</td>'
      + '<td class="mono" style="font-size:12px">' + (e.date.substr(5).replace('-','/') + ' ' + e.date.substr(11,8)) + '</td>'
      + '<td class="data-table-actions">'
        + '<button class="row-action" data-tip="Dettaglio" data-id="' + e.id + '" data-action="detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>'
        + (e.entity ? '<button class="row-action" data-tip="Timeline" data-entity="' + e.entity + '" data-eid="' + e.entityId + '" data-action="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>' : '')
      + '</td>'
      + '</tr>';
  }
  document.getElementById('log-tbody').innerHTML = html;
  document.getElementById('log-empty').hidden = filtered.length > 0;
  var end = Math.min(start + PAGE_SIZE, filtered.length);
  document.getElementById('footer-range').textContent = filtered.length > 0 ? (start + 1) + '\u2013' + end + ' di ' + filtered.length : 'Nessun evento';
  document.getElementById('pager-info').textContent = currentPage + ' / ' + totalPages;
  document.getElementById('pager-prev').disabled = currentPage <= 1;
  document.getElementById('pager-next').disabled = currentPage >= totalPages;
  document.getElementById('filter-count').textContent = filtered.length;
  document.getElementById('filter-page').textContent = currentPage + ' / ' + totalPages;
}

/* ── RENDER DETAIL ── */
function renderDetail(e) {
  document.getElementById('detail-title').textContent = 'Dettaglio evento #' + e.id;
  var html = ''
    + '<div class="detail-row"><span class="lbl">Tipo</span><span class="val"><span class="type-badge type-' + e.type + '">' + e.type + '</span></span></div>'
    + '<div class="detail-row"><span class="lbl">Azione</span><span class="val" style="font-family:var(--font-body);font-weight:600">' + e.action + '</span></div>'
    + '<div class="detail-row"><span class="lbl">Entità</span><span class="val">' + (e.entity ? e.entity + ' / ' + e.entityId : '\u2014') + '</span></div>'
    + '<div class="detail-row"><span class="lbl">Utente</span><span class="val">' + (e.actor || '\u2014') + (e.actorId ? ' (ID: ' + e.actorId + ')' : '') + '</span></div>'
    + '<div class="detail-row"><span class="lbl">Data</span><span class="val">' + e.date + '</span></div>'
    + '<div class="detail-row"><span class="lbl">Request ID</span><span class="val">' + (e.requestId || '\u2014') + '</span></div>'
    + '<div class="detail-row"><span class="lbl">IP</span><span class="val">' + (e.ip || '\u2014') + '</span></div>'
    + '<div class="json-viewer">' + JSON.stringify(e.data, null, 2) + '</div>';
  document.getElementById('detail-body').innerHTML = html;
  openModal('detail-modal');
}

/* ── RENDER TIMELINE ── */
function renderTimeline(entity, entityId) {
  var items = EVENTS.filter(function(e) { return e.entity === entity && e.entityId === entityId; }).sort(function(a,b) { return b.id - a.id; });
  document.getElementById('timeline-title').textContent = 'Timeline \u2014 ' + entity + ' / ' + entityId;
  var html = '<div class="timeline">';
  for (var i = 0; i < items.length; i++) {
    var e = items[i];
    var diffText = '';
    if (e.data && e.data.old !== undefined && e.data.new !== undefined) {
      var diffs = [];
      for (var k = 0; k < (e.data.fields || []).length; k++) {
        var f = e.data.fields[k];
        diffs.push('"' + (e.data.old ? e.data.old[f] || 'null' : 'null') + '" \u2192 "' + e.data.new[f] + '"');
      }
      if (diffs.length) diffText = diffs.join(', ');
    }
    html += '<div class="timeline-item">'
      + '<div class="tl-date">' + e.date.substr(5).replace('-','/') + ' ' + e.date.substr(11,5) + ' — <span class="type-badge type-' + e.type + '" style="font-size:10px">' + e.type + '</span></div>'
      + '<div class="tl-action">' + e.action + '</div>'
      + (diffText ? '<div class="tl-diff">' + diffText + '</div>' : '')
      + '</div>';
  }
  if (!items.length) html += '<div style="color:var(--muted);padding:12px 0">Nessun evento trovato.</div>';
  html += '</div>';
  document.getElementById('timeline-body').innerHTML = html;
  openModal('timeline-modal');
}

/* ── FILTERS ── */
document.getElementById('filter-type').addEventListener('change', function() {
  FILTERS.type = this.value; currentPage = 1; renderTable();
});

document.getElementById('search-input').addEventListener('input', function() {
  FILTERS.search = this.value.trim(); currentPage = 1; renderTable();
});

document.getElementById('date-from').addEventListener('change', function() {
  FILTERS.dateFrom = this.value; currentPage = 1; renderTable();
});
document.getElementById('date-to').addEventListener('change', function() {
  FILTERS.dateTo = this.value; currentPage = 1; renderTable();
});

/* ── PAGER ── */
document.getElementById('pager-prev').addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderTable(); } });
document.getElementById('pager-next').addEventListener('click', function() { var total = Math.ceil(filteredEvents().length / PAGE_SIZE) || 1; if (currentPage < total) { currentPage++; renderTable(); } });

/* ── ROW ACTIONS ── */
document.getElementById('log-tbody').addEventListener('click', function(e) {
  var btn = e.target.closest('.row-action');
  if (!btn) return;
  var id = Number(btn.dataset.id);
  var entity = btn.dataset.entity;
  var eid = btn.dataset.eid;
  if (btn.dataset.action === 'detail') {
    for (var i = 0; i < EVENTS.length; i++) { if (EVENTS[i].id === id) { renderDetail(EVENTS[i]); return; } }
  } else if (btn.dataset.action === 'timeline') {
    renderTimeline(entity, eid);
  }
});

/* ── INIT ── */
(function() { renderTable(); })();
</script>

</body>
</html>
