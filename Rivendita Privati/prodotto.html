<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prodotto · Kappa Design</title>
<meta name="description" content="Scheda prodotto: scegli colore, dimensioni e quantità, aggiungi al carrello con spedizione gratuita.">
<link rel="icon" type="image/png" href="img/logo-mark.png">
<link rel="stylesheet" href="styles.css">
</head>
<body id="pdp-page">

<div id="site-header"></div>

<div class="wrap crumb"><a href="index.html">Home</a> › <a href="catalogo.html">Catalogo</a> › <span id="crumb-nome">Prodotto</span></div>

<div class="wrap">
  <div class="pdp" id="pdp">
    <div class="gallery">
      <div class="thumbs" id="thumbs"></div>
      <div class="stage"><img id="stage-img" src="" alt=""></div>
    </div>

    <div>
      <h1 class="pdp-title" id="p-nome"></h1>
      <div class="pdp-meta" id="p-meta"></div>
      <div class="rating" id="p-rating" style="margin-top:10px"></div>
      <div class="pdp-price prezz" id="p-price"></div>

      <hr>
      <div class="opt-label">Colore</div>
      <div class="swatches" id="p-col"></div>
      <div class="opt-label" style="margin-top:16px">Dimensioni disponibili</div>
      <div class="swatches" id="p-dim"></div>

      <hr>
      <h3 style="font-size:16px">Descrizione</h3>
      <p id="p-desc" style="color:var(--ink-2);margin-top:8px"></p>
      <h3 style="font-size:16px;margin-top:20px">Caratteristiche</h3>
      <table class="spec" id="p-spec" style="margin-top:8px"></table>
    </div>

    <div class="buy-side">
      <div class="panel summary">
        <div class="prezz" style="margin-bottom:6px"><span class="now" id="p-price2"></span> <span class="was" id="p-was"></span></div>
        <div class="deliv" id="p-deliv"></div>
        <div class="prime" style="margin-top:4px"><span class="pz">prime</span> Spedito e venduto da Kappa Design</div>
        <label class="opt-label" for="p-qty" style="display:block;margin:16px 0 6px">Quantità</label>
        <input class="qty-inline" id="p-qty" type="number" min="1" max="99" value="1" style="width:80px">
        <button class="btn btn-buy btn-block" id="p-add" style="margin-top:14px">Aggiungi al carrello</button>
        <button class="btn btn-copper btn-block" id="p-buy" style="margin-top:8px">Acquista ora</button>
      </div>
      <div class="panel" style="padding:16px;font-size:13px;color:var(--ink-2)">
      <div style="display:flex;gap:10px;margin-bottom:10px"><b style="color:var(--link)">GRATIS</b> Consegna sopra 79 €</div>
      <div style="display:flex;gap:10px;margin-bottom:10px"><span>Reso gratuito entro 30 giorni</span></div>
      <div style="display:flex;gap:10px"><span>Pagamento sicuro e protetto</span></div>
      </div>
    </div>
  </div>
</div>

<section class="section alt">
  <div class="wrap">
    <div class="sec-head"><div><h2>Prodotti correlati</h2><p>Chi ha visto questo articolo ha acquistato anche</p></div></div>
    <div class="grid-p" id="correlati"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="app.js" defer></script>
</body>
</html>
